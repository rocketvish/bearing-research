[project]
name = "bearing-research"
version = "0.1.0"
description = "Research code for native context compression in LLMs: compressing coding-agent conversation context into optimized input-embedding vectors while keeping the frozen model's understanding."
readme = "README.md"
requires-python = ">=3.12"
# NOTE: torch must be installed from the PyTorch CUDA 12.8 nightly index
# (required for RTX 5090 / sm_120). Plain venv, not uv. See CLAUDE.md.
dependencies = [
    "torch",
    "transformers>=5.7.0",
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
]
